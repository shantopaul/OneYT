<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OneYT</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <span class="logo">OneYT</span>
      <span class="status" id="status">Loading…</span>
    </header>

    <main>
      <label class="row" for="enabled-toggle">
        <span class="row-text">
          <span class="row-label">Extension enabled</span>
          <span class="row-desc">Turn all OneYT customisation on or off.</span>
        </span>
        <span class="switch">
          <input type="checkbox" id="enabled-toggle" />
          <span class="slider"></span>
        </span>
      </label>

      <p class="hint" id="page-hint">Open a YouTube page to see OneYT at work.</p>

      <h2 class="section-title">Quick Settings</h2>

      <label class="row" for="focus-toggle">
        <span class="row-text">
          <span class="row-label">Focus Mode</span>
          <span class="row-desc">Hide comments, chat, recommendations and Shorts.</span>
        </span>
        <span class="switch">
          <input type="checkbox" id="focus-toggle" />
          <span class="slider"></span>
        </span>
      </label>

      <label class="row" for="scroll-toggle">
        <span class="row-text">
          <span class="row-label">Independent sidebar scroll</span>
          <span class="row-desc">Scroll recommendations without moving the player.</span>
        </span>
        <span class="switch">
          <input type="checkbox" id="scroll-toggle" />
          <span class="slider"></span>
        </span>
      </label>

      <label class="row" for="player-toggle">
        <span class="row-text">
          <span class="row-label">Player customisation</span>
          <span class="row-desc">Size, position and appearance of the video player.</span>
        </span>
        <span class="switch">
          <input type="checkbox" id="player-toggle" />
          <span class="slider"></span>
        </span>
      </label>

      <label class="row" for="theme-select">
        <span class="row-text">
          <span class="row-label">Theme</span>
          <span class="row-desc">YouTube colour theme.</span>
        </span>
        <select id="theme-select" class="theme-select"></select>
      </label>

      <label class="row" for="preset-select">
        <span class="row-text">
          <span class="row-label">Preset / Profile</span>
          <span class="row-desc">Apply a whole setup in one click.</span>
        </span>
        <select id="preset-select" class="theme-select"></select>
      </label>

      <button class="btn btn-primary" id="open-dashboard">Open Full Dashboard</button>
      <button class="btn btn-secondary" id="open-onboarding">Welcome setup</button>
    </main>

    <script src="../shared/constants.js"></script>
    <script src="../shared/defaults.js"></script>
    <script src="../shared/storage.js"></script>
    <script src="../shared/profiles.js"></script>
    <script src="../shared/themes.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
